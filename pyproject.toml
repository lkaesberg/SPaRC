[project]
name = "sparc-puzzle"
version = "0.0.0"
description = ""
authors = [
    {name = "larskaesberg",email = "larskaesberg@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.6.0",
    "openai (>=2.7.1,<4.0.0)",
    "tqdm (>=4.60.0,<5.0.0)",
    "rich (>=13.0.0,<14.0.0)",
    "sparc-gym (>=0.2.5,<0.3.0)",
    "sparc-visualization (>=0.1.3)",
    "aiohttp (>=3.9.0,<4.0.0)",
    "gymnasium (>=0.28.1)",
    "numpy (>=1.26.4)"
]

[project.optional-dependencies]
inspect = [
    "inspect-ai (>=0.3.279) ; python_version < \"3.15\""
]

# `uv sync` installs the dev group by default, so a fresh clone can run the Inspect task directly
# (`uv run inspect eval sparc/tasks.py@sparc`, the usage in the Inspect Evals register).
# pip users install the extra instead: pip install "sparc-puzzle[inspect]".
[dependency-groups]
dev = [
    "inspect-ai>=0.3.279; python_version < '3.15'",
]

[project.scripts]
sparc = "sparc.sparc:main"

[project.entry-points.inspect_ai]
sparc = "sparc.tasks"

[tool.poetry]
name = "sparc-puzzle"
description = ""
authors = ["larskaesberg <larskaesberg@gmail.com>"]
readme = "README.md"
packages = [{include = "sparc"}]

[tool.poetry.dependencies]
python = "^3.10"
datasets = ">=3.6.0"
openai = ">=2.7.1,<4.0.0"
tqdm = "^4.60.0"
rich = "^13.0.0"
sparc-visualization = ">=0.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "dataset_download: test downloads a dataset",
    "huggingface: test uses the Hugging Face Hub",
]
